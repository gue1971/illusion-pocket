<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Illusion Pocket</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">ILLUSION POCKET</p>
          <h1>錯覚ミュージアム</h1>
        </div>
        <button class="icon-button" id="shuffleButton" type="button" aria-label="ランダムに選ぶ">↻</button>
      </header>

      <section class="search-row" aria-label="錯覚を探す">
        <input id="searchInput" type="search" placeholder="錯覚名で検索" autocomplete="off" />
      </section>

      <nav class="filters" id="filters" aria-label="カテゴリ"></nav>

      <section class="viewer" aria-live="polite">
        <div class="viewer-topline">
          <span class="category-pill" id="categoryLabel"></span>
          <span class="counter" id="counterLabel"></span>
        </div>
        <div class="stage" id="stage"></div>
        <div class="content">
          <h2 id="illusionTitle"></h2>
          <p id="illusionLead"></p>
          <p class="hint" id="illusionHint"></p>
        </div>
      </section>

      <section class="drawer" aria-label="錯覚リスト">
        <div class="drawer-head">
          <h2>リスト</h2>
          <span id="resultCount"></span>
        </div>
        <div class="illusion-list" id="illusionList"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
